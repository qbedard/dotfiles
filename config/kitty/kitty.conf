# ~/.config/kitty/kitty.conf
font_family      family="Iosevka Term Extended"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

active_tab_font_style   bold
inactive_tab_font_style normal

# modify_font cell_width 110%
modify_font underline_position +2
modify_font underline_thickness 150%
undercurl_style thin-dense

# Nerd Font icons via symbol_map (Symbols Nerd Font Mono)
# https://github.com/ryanoasis/nerd-fonts/wiki/Glyph-Sets-and-Code-Points
symbol_map U+E5FA-U+E6B5                              Symbols Nerd Font Mono
symbol_map U+E700-U+E7C5                              Symbols Nerd Font Mono
symbol_map U+F000-U+F2E0                              Symbols Nerd Font Mono
symbol_map U+E200-U+E2A9                              Symbols Nerd Font Mono
symbol_map U+F0001-U+F1AF0                            Symbols Nerd Font Mono
symbol_map U+E300-U+E3E3                              Symbols Nerd Font Mono
symbol_map U+F400-U+F532                              Symbols Nerd Font Mono
symbol_map U+2665,U+26A1                              Symbols Nerd Font Mono
symbol_map U+E0A0-U+E0A2,U+E0B0-U+E0B3                Symbols Nerd Font Mono
symbol_map U+E0A3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D4  Symbols Nerd Font Mono
symbol_map U+23FB-U+23FE,U+2B58                       Symbols Nerd Font Mono
symbol_map U+F300-U+F372                              Symbols Nerd Font Mono
symbol_map U+E000-U+E00A                              Symbols Nerd Font Mono
symbol_map U+EA60-U+EBEB                              Symbols Nerd Font Mono
symbol_map U+E276C-U+E2771                            Symbols Nerd Font Mono
symbol_map U+2500-U+259F                              Symbols Nerd Font Mono

include themes/gruvbox_dark_medium.conf

mouse_hide_wait 5.0

enable_audio_bell no

draw_minimal_borders yes
tab_bar_style powerline
# background_opacity 0.97

editor .

clipboard_control no-append write-clipboard write-primary

term xterm-kitty

macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_thicken_font 0.1

cursor_trail 50
cursor_trail_decay 0.07 0.2
cursor_trail_start_threshold 50

map kitty_mod+enter launch --cwd=oldest
map cmd+enter launch --cwd=oldest

map kitty_mod+n next_window
map kitty_mod+p previous_window

map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right

map kitty_mod+up move_window up
map kitty_mod+left move_window left
map kitty_mod+right move_window right
map kitty_mod+down move_window down

map kitty_mod+y next_layout
map kitty_mod+o layout_action rotate

map ctrl+[ layout_action decrease_num_full_size_windows
map ctrl+] layout_action increase_num_full_size_windows

map cmd+plus change_font_size all +1.0
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0

#: Remap Ctrl+L to both scroll the current screen contents into the scrollback
#: buffer and clear the screen, instead of just clearing the screen.
map ctrl+l clear_terminal scroll active
