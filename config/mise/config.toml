[settings]
auto_env = true
dotfiles.root = "~/git/qbedard/dotfiles"
experimental = true
idiomatic_version_file_enable_tools = [
  "go",
  "node",
  "python",
  "terraform",
  "yarn",
]

[bootstrap.hooks]
pre-dotfiles = """
mkdir -p ~/.claude
mkdir -p ~/.config/fish/functions
mkdir -p ~/.config/gh
mkdir -p ~/.config/karabiner
mkdir -p ~/Library/Application Support/biome
mkdir -p ~/Library/Application Support/jesseduffield/lazydocker
mkdir -p ~/Library/Application Support/pypoetry
"""
post-packages = "bat cache --build"

[bootstrap.mise_shell_activate]
bash = true
# fish = true
zsh = true

[dotfiles]
"~/.claude" = { mode = "symlink-each", source = "~/git/qbedard/dotfiles/claude" }
"~/.config" = { mode = "symlink-each", source = "~/git/qbedard/dotfiles/config" }
"~/.amethyst.yml" = { source = "~/git/qbedard/dotfiles/amethyst.yaml" }
"~/.bashrc" = { source = "~/git/qbedard/dotfiles/bashrc" }
"~/.common.sh" = { source = "~/git/qbedard/dotfiles/common.sh" }
"~/.hushlogin" = { source = "~/git/qbedard/dotfiles/hushlogin" }
"~/.npmrc" = { source = "~/git/qbedard/dotfiles/npmrc" }
"~/.ripgreprc" = { source = "~/git/qbedard/dotfiles/ripgreprc" }
"~/.sql-formatter.json" = { source = "~/git/qbedard/dotfiles/sql-formatter.json" }
"~/.tflint.hcl" = { source = "~/git/qbedard/dotfiles/tflint.hcl" }
"~/.zshrc" = { source = "~/git/qbedard/dotfiles/zshrc" }
"~/Library/Application Support/biome/biome.json" = { source = "~/git/qbedard/dotfiles/config/biome.json" }
"~/Library/Application Support/jesseduffield/lazydocker/config.yml" = { source = "~/git/qbedard/dotfiles/lazydocker-config.yaml" }
"~/Library/Application Support/pypoetry/config.toml" = { source = "~/git/qbedard/dotfiles/config/pypoetry/config.toml" }

[tools]
go = "latest"
python = "3.13"
terraform = "latest"
usage = "latest"

"github:astral-sh/uv" = "latest"

"aqua:anthropics/claude-code" = "latest"

"github:astral-sh/ruff" = "latest"
"github:google/yamlfmt" = "latest"
"github:rtk-ai/icm" = "latest"
"github:koalaman/shellcheck" = "latest"
"github:tamasfe/taplo" = { version = "latest" }

"go:golang.org/x/tools/gopls" = "latest"
"npm:@biomejs/biome" = "latest"
"npm:tree-sitter-cli" = "latest"
"npm:prettier" = "latest"
"pipx:checkov" = "latest"
"pipx:poetry" = "latest"
"pipx:pre-commit" = "latest"
"pipx:pyright" = "latest"
"pipx:ty" = "latest"

# [tools."github:usagi-flow/evil-helix"]
