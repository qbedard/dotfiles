[bootstrap.hooks]
post-packages = "bat cache --build"

[bootstrap.mise_shell_activate]
bash = true
fish = true
zsh = true

# [bootstrap.repos] # TODO: Do we need this?
# "~/git/qbedard/dotfiles" = { url = "git@github.com:qbedard/dotfiles.git" }

[dotfiles]
"~/.claude" = { mode = "symlink-each", source = "claude" }
"~/.config" = { mode = "symlink-each", source = "config" }
"~/.amethyst.yml" = { source = "amethyst.yaml" }
"~/.bashrc" = { source = "bashrc" }
"~/.common.sh" = { source = "~/.common.sh" }
"~/.hushlogin" = { source = "hushlogin" }
"~/.npmrc" = { source = "npmrc" }
"~/.ripgreprc" = { source = "ripgreprc" }
"~/.sql-formatter.json" = { source = "~/.sql-formatter.json" }
"~/.tflint.hcl" = { source = "~/.tflint.hcl" }
"~/.zshrc" = { source = "zshrc" }
"~/Library/Application Support/biome/biome.json" = { source = "config/biome.json" }
"~/Library/Application Support/jesseduffield/lazydocker/config.yml" = { source = "lazydocker-config.yaml" }
"~/Library/Application Support/pypoetry/config.toml" = { source = "config/pypoetry/config.toml" }

[env]
MISE_EXPERIMENTAL = "1"

[settings]
auto_env = true
dotfiles.root = "~/git/qbedard/dotfiles"
experimental = true
idiomatic_version_file_enable_tools = [
  "go",
  "node",
  "python",
  "terraform",
  "yarn",
]

[tools]
go = "latest"
python = "3.13"
terraform = "latest"
usage = "latest"

"github:astral-sh/uv" = "latest"

"aqua:anthropics/claude-code" = "latest"

"github:astral-sh/ruff" = "latest"
"github:google/yamlfmt" = "latest"
"github:rtk-ai/icm" = "latest"
"github:koalaman/shellcheck" = "latest"
"github:tamasfe/taplo" = { version = "latest" }

"go:golang.org/x/tools/gopls" = "latest"
"npm:@biomejs/biome" = "latest"
"npm:tree-sitter-cli" = "latest"
"npm:prettier" = "latest"
"pipx:checkov" = "latest"
"pipx:poetry" = "latest"
"pipx:pre-commit" = "latest"
"pipx:pyright" = "latest"
"pipx:ty" = "latest"

